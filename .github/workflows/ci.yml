name: CI

# Every push and pull request runs the tests and clippy on Linux, macOS and
# Windows, and the frontend checks. The path handling, symbolic-link refusal and
# webview glue differ by platform, so a regression on one of them fails the push
# that brought it. The weekly run catches what changes with no push at all: each
# run installs the newest stable toolchain, and a new release can bring lints the
# last one did not have.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC

# A push on top of a run still going cancels it: the newer commit is the one
# whose result matters.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      # locales/*.json are generated; a hand edit to a committed catalog fails here
      - run: python3 scripts/gen-locales.py && git diff --exit-code -- locales/
      # THIRD-PARTY-NOTICES.txt is generated from Cargo.lock and the installed packages;
      # a dependency change that did not rerun the generator fails here
      - run: python3 scripts/gen-notices.py && git diff --exit-code -- THIRD-PARTY-NOTICES.txt
      # every text ink on every ground it is drawn on, both themes; no data-theme selectors
      # (pnpm check runs it too; a step of its own names what failed)
      - run: pnpm check:ink
      - run: pnpm check
      - run: pnpm build
